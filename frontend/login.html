<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AutoTaller</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-card">

    <!-- HEADER -->
    <div class="login-header">
      <div class="brand">AutoTaller</div>
      <div class="slogan">Sistema de Gestión</div>
    </div>

    <!-- BODY -->
    <div class="login-body">
      <h2>Iniciar Sesión</h2>

      <div id="mensaje-login"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
        </div>
        <button type="submit" class="btn-login">Ingresar</button>
      </form>
    </div>

    <!-- FOOTER -->
    <div class="login-footer">
      © 2026 Grupo 11 — ISW-306
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
